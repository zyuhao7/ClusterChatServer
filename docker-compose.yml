version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: chat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./chat.sql:/docker-entrypoint-initdb.d/001_chat.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chat_server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    ports:
      - "9120:9120"
    command: ["./bin/chat_server", "--config", "config/server.docker.conf", "0.0.0.0", "9120"]

  admin_service:
    build:
      context: .
      dockerfile: admin_service/Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: chat
      ADMIN_TOKEN: change-me
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8010:8010"

  nginx:
    image: nginx:1.27
    depends_on:
      - chat_server
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx/chat_stream.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mysql_data:
